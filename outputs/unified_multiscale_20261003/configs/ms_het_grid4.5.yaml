planning:
  region_profile: BESTEST600_derived_Wuhan_weather_reference
  time_step_hours: 1
  representative_day_weight: 1
  discount_rate: 1.0
  asset_lifetime_years: 1
  carbon_price_yuan_per_kg: 0.0
  exergy_penalty_yuan_per_kwh: 0.0
  ambient_reference_c: 0.0
  max_unserved_rate: 0.0
  max_scenario_unserved_rate: 0.0
  unserved_heat_penalty_yuan_per_kwh: 0.0
  firm_capacity_reserve_margin: 0.0
  enforce_n_minus_one: false
  design_outdoor_temperature_c: -4.85
grades:
- name: ideal_zone_service
  temperature_c: 27.0
nodes:
- name: plant
  x: 0.0
  y: 0.0
  demand_columns: {}
- name: district_a
  x: 1.0
  y: 0.5
  demand_columns:
    ideal_zone_service: heat_reference_no_gain_kw
- name: district_b
  x: 1.0
  y: -0.5
  demand_columns:
    ideal_zone_service: heat_reference_no_gain_kw
sources:
- name: bestest_ideal_air_system
  type: electric_boiler
  node: plant
  resource_kind: electric
  allowed_grades:
  - ideal_zone_service
  supply_temp_c: 27.0
  existing_capacity_kw: 1000.0
  max_new_capacity_kw: 0.0
  max_retire_capacity_kw: 0.0
  efficiency: 1.0
  variable_om_yuan_per_kwh_heat: 0.0
  firm_capacity_credit: 1.0
  firm_capacity_availability: 1.0
pipes:
- name: trunk_district_a
  from: plant
  to: district_a
  existing_capacity_kw: 0.0
  delivery_efficiency: 0.97
  cold_loss_sensitivity_per_c: 0.0
  loss_reference_temperature_c: 0.0
  minimum_delivery_efficiency: 0.9
  pumping_electricity_kwh_per_kwh_heat: 0.008
  length_m: 400.0
  roughness_mm: 0.1
  heat_loss_w_per_mk: 0.24
  diameter_options:
  - name: dn40
    capacity_kw: 12.0
    capex_total_yuan: 18000.0
  - name: dn65
    capacity_kw: 40.0
    capex_total_yuan: 30000.0
- name: trunk_district_b
  from: plant
  to: district_b
  existing_capacity_kw: 0.0
  delivery_efficiency: 0.97
  cold_loss_sensitivity_per_c: 0.0
  loss_reference_temperature_c: 0.0
  minimum_delivery_efficiency: 0.9
  pumping_electricity_kwh_per_kwh_heat: 0.008
  length_m: 400.0
  roughness_mm: 0.1
  heat_loss_w_per_mk: 0.24
  diameter_options:
  - name: dn40
    capacity_kw: 12.0
    capex_total_yuan: 18000.0
  - name: dn65
    capacity_kw: 40.0
    capex_total_yuan: 30000.0
storages: []
demand_response:
  max_shift_fraction: 0.0
multi_energy_services:
  cooling:
    enabled: true
    demand_columns:
      district_a: steady_cooling_demand_kw
      district_b: steady_cooling_demand_kw
    max_unserved_rate: 0.0
    max_scenario_unserved_rate: 0.0
    unserved_penalty_yuan_per_kwh: 0.0
    sources:
      bestest_ideal_air_system:
        eer: 1.0
        eer_min: 1.0
        eer_max: 1.0
        eer_loss_per_c_above_reference: 0.0
        capacity_equivalence: 1.0
        variable_om_yuan_per_kwh_cooling: 0.0
        direct_emission_kg_per_kwh_cooling: 0.0
building_thermal:
  enabled: true
  outdoor_temperature_column: outdoor_temp
  simultaneous_mode: exclusive
  boundary_mode: fixed
  buildings:
  - name: bestest600_light
    node: district_a
    heat_grade: ideal_zone_service
    area_m2: 48.0
    heat_loss_kw_per_c: 0.10430000000000002
    thermal_capacity_kwh_per_c: 0.535576
    min_temperature_c: 20.0
    max_temperature_c: 27.0
    initial_temperature_c: 20.0
    final_temperature_c: 20.0
    internal_gain_column: internal_gain_kw
    solar_gain_column: solar_gain_kw
    heating_service_column: heating_service
    heating_enabled: true
    cooling_enabled: true
    max_heat_kw: 1000.0
    max_cooling_kw: 1000.0
  - name: bestest600_heavy
    node: district_b
    heat_grade: ideal_zone_service
    area_m2: 48.0
    heat_loss_kw_per_c: 0.10430000000000002
    thermal_capacity_kwh_per_c: 2.142304
    min_temperature_c: 20.0
    max_temperature_c: 27.0
    initial_temperature_c: 20.0
    final_temperature_c: 20.0
    internal_gain_column: internal_gain_kw
    solar_gain_column: solar_gain_kw
    heating_service_column: heating_service
    heating_enabled: true
    cooling_enabled: true
    max_heat_kw: 1000.0
    max_cooling_kw: 1000.0
grid_connection:
  existing_capacity_kw: 4.5
  max_new_capacity_kw: 0.0
  capex_yuan_per_kw: 0.0
  reserve_margin: 0.0
  firm_capacity_method: portfolio_dispatch
  firm_simultaneity: 1.0
