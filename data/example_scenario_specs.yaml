period_weight: 180
risk:
  cvar_alpha: 0.85
  cvar_weight: 0.10

scenarios:
  - name: normal_winter
    probability: 0.55

  - name: severe_cold
    probability: 0.25
    temperature_offset_c: -6
    demand_multiplier: 1.12
    waste_heat_multiplier: 0.90
    electricity_price_multiplier: 1.10

  - name: compound_cold_wave
    probability: 0.15
    temperature_offset_c: -10
    waste_source_temp_offset_c: -3
    demand_multiplier: 1.20
    waste_heat_multiplier: 0.75
    electricity_price_multiplier: 1.25
    grid_emission_multiplier: 1.08

  - name: low_waste_high_power_price
    probability: 0.05
    temperature_offset_c: -4
    demand_multiplier: 1.08
    waste_heat_multiplier: 0.50
    electricity_price_multiplier: 1.50
    grid_emission_multiplier: 1.12
