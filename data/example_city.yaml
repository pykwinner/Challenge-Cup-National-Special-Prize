planning:
  region_profile: northern_severe_cold
  design_outdoor_temperature_c: -26
  discount_rate: 0.05
  asset_lifetime_years: 20
  time_step_hours: 1
  representative_day_weight: 180
  carbon_price_yuan_per_kg: 0.08
  exergy_penalty_yuan_per_kwh: 0.30
  unserved_heat_penalty_yuan_per_kwh: 100
  max_unserved_rate: 0.0
  firm_capacity_reserve_margin: 0.25
  critical_peak_duration_hours: 12
  n_minus_1_source_names: [gas_peak_boiler]
  n_minus_1_pipe_names: [trunk_a]
  ambient_reference_c: 0
  mip_gap: 0.005
  time_limit_seconds: 120

grades:
  - name: high
    temperature_c: 75
  - name: low
    temperature_c: 45

nodes:
  - name: plant
    x: 0.0
    y: 0.0
    demand_columns: {}
  - name: district_a
    x: 1.2
    y: 0.7
    demand_columns:
      high: demand_a_high
      low: demand_a_low
    temperature_retrofit:
      source_grade: high
      target_grade: low
      eligible_fraction: 0.45
      capex_total_yuan: 980000
    thermal_inertia:
      high:
        thermal_capacity_kwh_per_c: 600
        max_temperature_deviation_c: 1.0
        recovery_loss_per_hour: 0.025
        comfort_penalty_yuan_per_degree_hour: 0.22
      low:
        thermal_capacity_kwh_per_c: 420
        max_temperature_deviation_c: 1.0
        recovery_loss_per_hour: 0.025
        comfort_penalty_yuan_per_degree_hour: 0.22
  - name: district_b
    x: 2.1
    y: -0.3
    demand_columns:
      high: demand_b_high
      low: demand_b_low
    temperature_retrofit:
      source_grade: high
      target_grade: low
      eligible_fraction: 0.35
      capex_total_yuan: 760000
    thermal_inertia:
      high:
        thermal_capacity_kwh_per_c: 480
        max_temperature_deviation_c: 1.0
        recovery_loss_per_hour: 0.03
        comfort_penalty_yuan_per_degree_hour: 0.25
      low:
        thermal_capacity_kwh_per_c: 340
        max_temperature_deviation_c: 1.0
        recovery_loss_per_hour: 0.03
        comfort_penalty_yuan_per_degree_hour: 0.25

sources:
  - name: industrial_waste_heat
    node: plant
    type: direct_heat
    resource_kind: waste_heat
    supply_temp_c: 92
    allowed_grades: [high, low]
    existing_capacity_kw: 650
    max_new_capacity_kw: 450
    capex_yuan_per_kw: 1550
    variable_cost_yuan_per_kwh_heat: 0.045
    emission_kg_per_kwh_heat: 0.015
    availability_column: waste_heat_availability
    firm_capacity_credit: 0.80

  - name: central_waste_source_hp
    node: plant
    type: heat_pump
    resource_kind: waste_heat
    allowed_grades: [high, low]
    existing_capacity_kw: 300
    max_new_capacity_kw: 800
    capex_yuan_per_kw: 2100
    variable_om_yuan_per_kwh_heat: 0.018
    source_temp_column: waste_source_temp
    carnot_efficiency: 0.48
    cop_min: 1.8
    cop_max: 5.5
    firm_capacity_credit: 0.85

  - name: gas_peak_boiler
    node: plant
    type: direct_heat
    resource_kind: fossil
    supply_temp_c: 110
    allowed_grades: [high, low]
    existing_capacity_kw: 1500
    max_new_capacity_kw: 0
    variable_cost_yuan_per_kwh_heat: 0.36
    emission_kg_per_kwh_heat: 0.205
    unit_commitment: true
    minimum_output_fraction: 0.12
    ramp_up_fraction_per_hour: 0.45
    ramp_down_fraction_per_hour: 0.55
    startup_cost_yuan: 180
    shutdown_cost_yuan: 40
    firm_capacity_credit: 1.0

  - name: distributed_air_hp_b
    node: district_b
    type: heat_pump
    resource_kind: renewable
    allowed_grades: [low]
    existing_capacity_kw: 0
    max_new_capacity_kw: 650
    capex_yuan_per_kw: 1850
    variable_om_yuan_per_kwh_heat: 0.022
    source_temp_column: outdoor_temp
    carnot_efficiency: 0.42
    cop_min: 1.5
    cop_max: 4.2
    cutoff_temperature_c: -25
    low_temperature_derating:
      threshold_c: -7
      slope_per_c: 0.025
      minimum_factor: 0.55
    defrost_temperature_band_c: [-5, 5]
    defrost_cop_multiplier: 0.88
    firm_capacity_credit: 0.55

  - name: electric_backup_boiler
    node: plant
    type: electric_boiler
    resource_kind: electric
    supply_temp_c: 100
    allowed_grades: [high, low]
    existing_capacity_kw: 0
    max_new_capacity_kw: 1800
    capex_yuan_per_kw: 560
    variable_om_yuan_per_kwh_heat: 0.012
    efficiency: 0.98
    firm_capacity_credit: 0.95

  - name: district_a_emergency_eb
    node: district_a
    type: electric_boiler
    resource_kind: electric
    supply_temp_c: 100
    allowed_grades: [high, low]
    existing_capacity_kw: 0
    max_new_capacity_kw: 1200
    capex_yuan_per_kw: 650
    variable_om_yuan_per_kwh_heat: 0.015
    efficiency: 0.98
    firm_capacity_credit: 0.95

pipes:
  - name: trunk_a
    from: plant
    to: district_a
    existing_capacity_kw: 1900
    delivery_efficiency: 0.965
    cold_loss_sensitivity_per_c: 0.00030
    loss_reference_temperature_c: 0
    minimum_delivery_efficiency: 0.92
    pumping_electricity_kwh_per_kwh_heat: 0.008
    length_m: 2400
    roughness_mm: 0.10
    heat_loss_w_per_mk: 0.24
    existing_hydraulic:
      diameter_mm: 200
    diameter_options: []

  - name: trunk_b
    from: plant
    to: district_b
    existing_capacity_kw: 0
    delivery_efficiency: 0.955
    cold_loss_sensitivity_per_c: 0.00035
    loss_reference_temperature_c: 0
    minimum_delivery_efficiency: 0.90
    pumping_electricity_kwh_per_kwh_heat: 0.010
    length_m: 3100
    roughness_mm: 0.10
    heat_loss_w_per_mk: 0.23
    diameter_options:
      - name: DN150
        diameter_mm: 150
        capacity_kw: 1000
        capex_total_yuan: 920000
      - name: DN200
        diameter_mm: 200
        capacity_kw: 1600
        capex_total_yuan: 1280000

  - name: interconnector_ab
    from: district_a
    to: district_b
    existing_capacity_kw: 0
    delivery_efficiency: 0.972
    bidirectional: true
    cold_loss_sensitivity_per_c: 0.00025
    loss_reference_temperature_c: 0
    minimum_delivery_efficiency: 0.93
    pumping_electricity_kwh_per_kwh_heat: 0.006
    length_m: 1450
    roughness_mm: 0.10
    heat_loss_w_per_mk: 0.22
    diameter_options:
      - name: DN100
        diameter_mm: 100
        capacity_kw: 500
        capex_total_yuan: 470000
      - name: DN150
        diameter_mm: 150
        capacity_kw: 900
        capex_total_yuan: 720000

storages:
  - name: central_low_temp_tank
    node: plant
    grade: low
    existing_capacity_kwh: 100
    max_new_capacity_kwh: 1600
    capex_yuan_per_kwh: 260
    power_to_energy_ratio_per_hour: 0.30
    charge_efficiency: 0.96
    discharge_efficiency: 0.96
    self_loss_per_hour: 0.001
    boundary_mode: cyclic
    firm_capacity_credit: 0.90

  - name: district_a_pcm
    node: district_a
    grade: high
    existing_capacity_kwh: 0
    max_new_capacity_kwh: 700
    capex_yuan_per_kwh: 430
    power_to_energy_ratio_per_hour: 0.40
    charge_efficiency: 0.94
    discharge_efficiency: 0.94
    self_loss_per_hour: 0.0015
    boundary_mode: cyclic
    firm_capacity_credit: 0.85

grid_connection:
  existing_capacity_kw: 360
  max_new_capacity_kw: 1800
  capex_yuan_per_kw: 820
  reserve_margin: 0.15
  firm_simultaneity: 1.0

demand_response:
  max_shift_fraction: 0.08
  response_window_hours: 6
  penalty_yuan_per_kwh: 0.06

engineering_postcheck:
  design_delta_t_c: 25
  water_density_kg_per_m3: 985
  water_cp_kj_per_kgk: 4.18
  dynamic_viscosity_pa_s: 0.00055
  pump_efficiency: 0.72
  max_velocity_m_per_s: 3.0
  max_pressure_drop_pa_per_m: 300
  max_thermal_loss_share: 0.08
