profile:
  id: national_15th_fyp_reference_2026
  name: 国家“十五五”供热低碳转型战略参考画像
  period: 2026-2030
  issued_date: 2026-07-20
  last_verified_date: 2026-07-20
  version: 1.2
  default_enforcement: false
  note: >-
    本画像只使用已核验的国家正式文件，用于战略对齐、机制设计和证据追溯。
    国家宏观目标不得直接作为单个城市或项目的硬约束；只有分母口径一致、
    地方任务已分解、资产清单与基线经审计后，才能转为项目约束。

