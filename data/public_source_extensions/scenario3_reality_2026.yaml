sources:
  - id: S3_WUHAN_SPATIAL_PLAN_2025
    title: "武汉市国土空间总体规划（2021—2035年）"
    institution: "武汉市人民政府、武汉市自然资源和城乡建设局"
    year: 2025
    authority_type: official_government_plan
    url: "https://zrzyhgh.wuhan.gov.cn/zwgk_18/fdzdgk/ghjh/zzqgh/202508/t20250822_2636676.shtml"
    accessed_on: "2026-07-12"
    limitations: "战略规划只规定空间与技术方向，不提供逐时负荷、设备投资或运行绩效。"

  - id: S3_WUHAN_LOW_ENERGY_DRAFT_2024
    title: "武汉市低能耗居住建筑节能设计标准（征求意见稿）"
    institution: "武汉市市场监督管理局"
    year: 2024
    authority_type: official_local_standard_draft
    url: "https://zrzyhgh.wuhan.gov.cn/gsggzx/qtgs/202410/P020241024763787490327.pdf"
    accessed_on: "2026-07-12"
    limitations: "属于征求意见稿，适合用作先进情景和工程边界，不能表述为已生效强制条文。"

  - id: S3_GB50736_COMFORT_GUIDE_2026
    title: "湖南省绿色建筑工程设计要点（附录引用GB 50736-2012室内设计参数）"
    institution: "湖南省住房和城乡建设厅"
    year: 2026
    authority_type: official_government_standard_guide
    url: "https://www.hunan.gov.cn/zqt/zcsd/202601/33892718/files/4e61f24b71724accba0688c2f2f136d5.pdf"
    accessed_on: "2026-07-12"
    limitations: "引用的是全国通用GB 50736参数，但文件发布地不是武汉；实际项目仍须执行湖北和武汉审图要求。"

  - id: S3_CAIDIAN_ENERGY_STATION_2023
    title: "武汉首座能源站基本建成，中法生态城实现区域集中供冷供暖"
    institution: "武汉市蔡甸区人民政府"
    year: 2023
    authority_type: official_government_project_report
    url: "https://www.caidian.gov.cn/zwgk/zwdt/cdxw/202301/t20230106_2126240.shtml"
    accessed_on: "2026-07-12"
    limitations: "数据来自建设调试阶段，不是多年运行审计；投资包含站房和约9公里管网。"

  - id: S3_HANKOU_RIVER_ENERGY_2022
    title: "江水空调：汉口滨江国际商务区江水源可再生能源站"
    institution: "武汉市生态环境局"
    year: 2022
    authority_type: official_government_project_report
    url: "https://hbj.wuhan.gov.cn/hjxw/202203/t20220310_1935893.html"
    accessed_on: "2026-07-12"
    limitations: "节电量和成本降幅是项目测算；报道水温不应直接外推为全年逐时水温。"

  - id: S3_HANKOU_RIVER_BOND_2021
    title: "湖北省政府专项债券项目披露：汉口滨江国际商务区江水源可再生能源站"
    institution: "中国地方政府债券信息公开平台、湖北省财政部门"
    year: 2021
    authority_type: official_project_financing_disclosure
    url: "https://www.governbond.org.cn/uploadFiles/42/attachFiles/202112/00389de7-94fd-49d0-9985-b7f269bdc263.pdf"
    accessed_on: "2026-07-12"
    limitations: "以办公商业建筑为主，投资含地下站房、取退水和管网，价格基年早于2026年。"

  - id: S3_SIXIN_WASTEWATER_GROUND_2023
    title: "四新方岛污水源与地源热泵复合能源站"
    institution: "武汉市人民政府"
    year: 2023
    authority_type: official_government_project_report
    url: "https://www.wuhan.gov.cn/sy/whyw/202309/t20230908_2261166.shtml"
    accessed_on: "2026-07-12"
    limitations: "能源占比和减排量为规划测算，缺少投资、逐时污水流量和长期实测COP。"

  - id: S3_WUHAN_GROUNDWATER_RULE_2022
    title: "武汉市地下水管理办法（2022年第三次修改）"
    institution: "武汉市人民政府"
    year: 2022
    authority_type: official_local_regulation
    url: "https://www.wuhan.gov.cn/zwgk/xxgk/zfgb/202211/P020221117672366609914.pdf"
    accessed_on: "2026-07-12"
    limitations: "主要约束开式地下水热泵；闭式地埋管仍需按场地勘察、热响应试验和地下空间条件另行判断。"

  - id: S3_HUBEI_TOU_2024
    title: "湖北省工商业分时电价机制调整方案"
    institution: "湖北省发展和改革委员会"
    year: 2024
    authority_type: official_price_policy
    url: "https://media.hubei.gov.cn/zyxmt/push/weixin/202403/t20240329_5139254.shtml"
    accessed_on: "2026-07-12"
    limitations: "倍率作用于市场化交易或代理购电基价；能源站是否适用及基本电费需按接电类别复核。"

  - id: S3_WUHAN_CLIMATE_2024
    title: "武汉市概况：2024年气候气象"
    institution: "武汉市生态环境局、武汉气象资料"
    year: 2025
    authority_type: official_government_climate_report
    url: "https://hbj.wuhan.gov.cn/gkxx/202504/t20250421_2569976.html"
    accessed_on: "2026-07-12"
    limitations: "单一年份适合极端年压力测试，不能替代典型气象年和多年联合概率分布。"

  - id: S3_WUHAN_GRID_PEAK_2025
    title: "武汉电网负荷创历史新高"
    institution: "武汉市人民政府、国网武汉供电公司"
    year: 2025
    authority_type: official_grid_report
    url: "https://www.wuhan.gov.cn/sy/kwh/202507/t20250709_2617474.shtml"
    accessed_on: "2026-07-12"
    limitations: "为全市电网尺度，不能替代具体地块的10kV接入容量、短路容量和增容批复。"

  - id: S3_CAMPUS_GRID_EPC_2024
    title: "武汉理工大学马房山校区供配电及电力管线EPC"
    institution: "武汉市公共资源交易服务平台"
    year: 2024
    authority_type: official_public_procurement
    url: "https://ggzyfw.wuhan.gov.cn/whggzy/jygkjt/978947.jhtml"
    accessed_on: "2026-07-12"
    limitations: "中标价含设计、箱变、电缆、迁改和报装，不能作为纯变压器设备单价。"

  - id: S3_WUHAN_VPP_2025
    title: "武汉虚拟电厂精准需求响应奖励"
    institution: "武汉市人民政府、国网武汉供电公司"
    year: 2025
    authority_type: official_demand_response_report
    url: "https://www.wuhan.gov.cn/sy/whyw/202507/t20250710_2618427.shtml"
    accessed_on: "2026-07-12"
    limitations: "属于试点事件和事件型补偿，不应假设为全年固定容量收入。"

  - id: S3_DEFROST_EXPERIMENT_2024
    title: "空气源热泵多台室外机并联轮换除霜实验研究"
    institution: "制冷学报、北京工业大学等"
    year: 2024
    authority_type: peer_reviewed_experimental_paper
    url: "https://www.zhilengxuebao.com/zh/article/doi/10.12465/j.issn.0253-4339.2024.06.158/"
    accessed_on: "2026-07-12"
    limitations: "实验中的-10摄氏度比武汉多数小时更冷，适合校准极端除霜损失而不是全年平均COP。"

  - id: S3_DEFROST_WEATHER_CONTROL_2025
    title: "基于气象参数联动控制技术的热泵空调器热气除霜研究"
    institution: "格力电器、制冷"
    year: 2025
    authority_type: original_experimental_paper
    url: "https://cnki.istiz.org.cn/kcms/detail/detail.aspx?dbcode=CJFQ&dbname=CJFD2025&filename=ZLZZ202506015"
    accessed_on: "2026-07-12"
    limitations: "厂商实验仅报告相对改进量，未披露增量投资和武汉现场多年运行结果。"

