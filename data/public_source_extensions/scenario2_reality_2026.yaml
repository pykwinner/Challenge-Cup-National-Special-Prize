sources:
  - source_id: S2_NX_BIOMASS_REPLY_2025
    scenario: scenario2_distributed_clean
    category: 生物质资源/竞争用途/颗粒市场
    publisher: 宁夏回族自治区农业农村厅
    title: 关于自治区政协十三届三次会议第508号提案答复的函
    url: https://nynct.nx.gov.cn/zwgk/zfxxgkml/tajybljggk/202512/t20251223_5116803.html
    data_year: 2024-2025
    authority: 自治区农业主管部门
    use_in_model: 校准秸秆可收集量与竞争用途、颗粒产能利用率、成品燃料价格和供应链原料分类
    caveat: 自治区总量不能直接当作固原项目可签约量；吴忠与固原合计产能也不能无分配依据地全部归入本项目
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_GUYUAN_STATS_2024
    scenario: scenario2_distributed_clean
    category: 农业统计/作物资源
    publisher: 固原市人民政府
    title: 固原市2024年国民经济和社会发展统计公报
    url: https://www.nxgy.gov.cn/zwgk/zfxxgkml/tjxx/tjfx/202507/t20250701_4949688.html
    data_year: "2024"
    authority: 地方政府统计公报
    use_in_model: 校准作物产量、夏粮与秋粮季节性以及县域资源规模上界
    caveat: 作物产量必须再乘草谷比、可收集系数并扣除饲料化和还田等竞争用途，不能直接作为燃料量
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_MOA_STRAW_LEDGER_2019
    scenario: scenario2_distributed_clean
    category: 秸秆资源核算方法
    publisher: 中华人民共和国农业农村部
    title: 农作物秸秆资源台账制度
    url: https://www.moa.gov.cn/nybgb/2019/201902/201905/P020190518382510679732.pdf
    data_year: "2019"
    authority: 农业农村部技术制度
    use_in_model: 规定草谷比、可收集系数和15%含水率统一口径，避免把粮食产量直接换成能源供应量
    caveat: 推荐系数需要用宁夏或固原实测系数更新；该文件给出核算方法而非固原结果
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_NX_CLEAN_HEAT_GUIDE_2023
    scenario: scenario2_distributed_clean
    category: 生物质炉/低温空气源热泵技术要求
    publisher: 宁夏回族自治区住房和城乡建设厅
    title: 宁夏回族自治区北方地区冬季清洁取暖技术指南
    url: https://jst.nx.gov.cn/zwgk/zcwjk/gzwj/202309/P020230901584449827922.pdf
    data_year: "2023"
    authority: 自治区住建技术指南
    use_in_model: 校准颗粒热值、最大供应半径、户式炉具效率和污染物、热泵截止温度及设计COP
    caveat: 炉具指标主要适用于额定供热量小于50kW的户式设备，不能直接套用到1.45MW区域锅炉
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_GUYUAN_ASHP_PROCUREMENT_2024
    scenario: scenario2_distributed_clean
    category: 空气源热泵政府采购
    publisher: 宁夏政府采购公共服务平台
    title: 固原市城区散煤取暖用户热源清洁化改造工程项目四期十四标段采购需求
    url: https://www.ccgp-ningxia.gov.cn/public/NXGPPNEW/dynamic/contents/CGXQ/content.jsp?cid=2076&id=8b80b23e90c3fcf80190c48d6f6e52c1&sid=1
    data_year: "2024"
    authority: 政府采购需求
    use_in_model: 校准固原户式热风机投资、-12℃与-20℃COP、极寒容量和HSPF下限
    caveat: 采购技术下限不等于长期实测性能；户均预算还包括电辅热、电热毯、配电和安装内容
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_STRAW_LOGISTICS_RESEARCH_2016
    scenario: scenario2_distributed_clean
    category: 秸秆收储运优化
    publisher: 农业工程学报
    title: 华北平原地区玉米秸秆连续供应模型的建立及应用
    url: https://www.aeeisp.com/nygcxb/article/doi/10.11975/j.issn.1002-6819.2016.19.028
    data_year: "2016"
    authority: 同行评议原始研究
    use_in_model: 支撑收储站选址、两级运输、成本分解、能耗和设施离散决策结构
    caveat: 山东肥城10万吨原秸秆案例且价格年份较早，只能用于模型结构与比例敏感性，不能替代固原成品颗粒价格
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_GUYUAN_HOUSEHOLD_CASE_2024
    scenario: scenario2_distributed_clean
    category: 农户运行费用/用户负担
    publisher: 固原市人民政府
    title: 清洁能源让百姓过上干净暖冬
    url: https://www.nxgy.gov.cn/xwzx/gyyw/202411/t20241126_4738785.html
    data_year: "2024"
    authority: 地方政府实地报道
    use_in_model: 提供生物质颗粒季用量、燃料价格、原煤对照、设备补贴和农户自付的现实校验点
    caveat: 单户受访案例未披露建筑面积、设定温度和逐日气象，只能作为账单校验点而非总体均值
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_YUANZHOU_SUBSIDY_2023
    scenario: scenario2_distributed_clean
    category: 清洁取暖补贴/资金分担
    publisher: 固原市原州区人民政府
    title: 原州区2023年度北方地区冬季清洁取暖项目实施方案
    url: https://www.yzh.gov.cn/zzb/zcwj_68006/202312/t20231208_4376786.html
    data_year: "2023"
    authority: 区县政府实施方案
    use_in_model: 校准各技术每户建设补贴、农房节能补贴、补助面积和居民自筹比例
    caveat: 财政政策明确补建设不补运行；年度补贴标准不能自动外推至后续年份
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_NX_HEATING_TARIFF_2026
    scenario: scenario2_distributed_clean
    category: 居民清洁供暖分时电价
    publisher: 宁夏回族自治区发展和改革委员会
    title: 自治区发展改革委关于完善居民清洁供暖用电价格政策的通知
    url: https://fzggw.nx.gov.cn/tzgg/202512/t20251208_5101851.html
    data_year: "2026执行"
    authority: 自治区价格主管部门
    use_in_model: 替换合成电价曲线，驱动热泵、蓄热和电池的峰谷调度
    caveat: 仅适用于符合条件的居民清洁供暖用电；区域微网总表或工商业接入点需另核电价资格
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_GUYUAN_RURAL_INCOME_2025
    scenario: scenario2_distributed_clean
    category: 农村居民收入/能源负担
    publisher: 固原市农业农村局
    title: 固原市聚焦农民增收核心构建多元驱动体系推动农村居民收入稳步提升
    url: https://www.nxgy.gov.cn/zwgk/zfxxgkml/jzfp_1/xczxgzdt/202603/t20260316_5194210.html
    data_year: "2025"
    authority: 地方农业主管部门
    use_in_model: 构造取暖账单占收入比例、低收入压力情景和用户可负担性指标
    caveat: 人均平均收入不能替代家庭人口、收入分位和脱贫监测户收入调查
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_GUYUAN_IMPLEMENTATION_2022
    scenario: scenario2_distributed_clean
    category: 清洁取暖投资/转型时序/能源保供
    publisher: 固原市人民政府
    title: 固原市冬季清洁取暖项目实施方案
    url: https://www.nxgy.gov.cn/zwgk/zcwj/qtwj/jgzn_35170/202208/t20220819_3678909.html
    data_year: "2022-2024"
    authority: 地方政府实施方案
    use_in_model: 校准资金承担者、农村改造规模、配网改造项目和先立后破的多阶段约束
    caveat: 规划投资不等于项目最终结算；各子项目成本需进一步拆分
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_GUYUAN_GRID_ZHANGYI_2024
    scenario: scenario2_distributed_clean
    category: 农村电网扩容项目
    publisher: 固原市人民政府
    title: 固原供电助力土豆豆变金豆豆
    url: https://www.nxgy.gov.cn/zzb/gyyw_67229/202411/t20241128_4741619.html
    data_year: "2023竣工/2024报道"
    authority: 地方政府项目报道
    use_in_model: 证明电网升级具有固定项目成本和离散线路扩建特征
    caveat: 页面未披露新增变电容量，不能用总投资反算通用元每千瓦造价
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_NEA_STORAGE_REPORT_2025
    scenario: scenario2_distributed_clean
    category: 新型储能造价/利用率/技术路线
    publisher: 国家能源局能源节约和科技装备司、电力规划设计总院
    title: 中国新型储能发展报告2025
    url: https://www.nea.gov.cn/20250731/1d40d09f75714280a9218d5bea178fbd/228ab8631dcc4b2293c84dc1f07e6e42.pdf
    data_year: "2024"
    authority: 国家能源主管部门报告
    use_in_model: 校准储能时长、年度等效循环、技术路线和成本下降情景
    caveat: 统计以大型电站为主；先进电芯循环上限不应直接作为农村小微电池系统保守寿命
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_MIIT_BATTERY_RULE_2024
    scenario: scenario2_distributed_clean
    category: 储能电池寿命/安全质量
    publisher: 中华人民共和国工业和信息化部
    title: 锂离子电池行业规范条件（2024年本）
    url: https://www.miit.gov.cn/cms_files/filemanager/1226211233/attach/20246/1b2c425b31524352a0ea0571b51f1d9b.pdf
    data_year: "2024"
    authority: 工业和信息化部规范条件
    use_in_model: 设定电池组循环寿命、容量保持率和更换触发条件
    caveat: 属行业引导性条件；实验循环寿命不等于固原低温环境下的日历寿命
    retrieved_at_utc: "2026-07-12T09:10:30Z"

  - source_id: S2_STORAGE_MARKET_2025
    scenario: scenario2_distributed_clean
    category: 储能系统/EPC市场价格
    publisher: 新华财经、上海证券报（引CESA储能应用分会数据）
    title: 野蛮生长后面临失速危机储能业破内卷需规范与创新双管齐下
    url: https://finance.sina.cn/2025-08-06/detail-infiywak1185865.d.html
    data_year: "2024-2025H1"
    authority: 行业数据库与主流财经媒体
    use_in_model: 为电池系统与EPC投资提供市场区间并设置小型微网安全集成溢价
    caveat: 大型项目均价不包含农村小微项目全部EMS、消防、施工和运维溢价；报道提示部分低价已低于成本
    retrieved_at_utc: "2026-07-12T09:10:30Z"

