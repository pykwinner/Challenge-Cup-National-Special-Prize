sources:
  - source_id: S1_URUMQI_FINAL_PLAN_2026
    scenario: scenario1_existing_network
    category: 正式供热规划与可靠性标准
    publisher: 乌鲁木齐市人民政府、乌鲁木齐市城市管理局
    title: 乌鲁木齐城市供热高质量发展规划（2025—2027年）
    url: https://www.wlmq.gov.cn/wlmqs/c128188/202601/a5bed3c0c5e24011a254b71bf5d495f8.shtml
    data_year: 2025-2027规划（2026年正式发布）
    authority: 地方政府正式专项规划
    use_in_model: 近期负荷、供回水温度、管网热损与失水、事故持续时间和规划成效校准
    caveat: 规划需求范围不含甘泉堡工业园；规划目标不等同于逐时运行实测值

  - source_id: S1_URUMQI_STATS_2024
    scenario: scenario1_existing_network
    category: 城市能源与供热实绩
    publisher: 乌鲁木齐市统计局
    title: 2024年乌鲁木齐市国民经济和社会发展统计公报
    url: https://www.wlmq.gov.cn/wlmqs/c119359/202504/0e8ee60b2c264168af822ad14a49a7d1.shtml
    data_year: 2024
    authority: 地方政府统计公报
    use_in_model: 全年供热量、天然气供给和地区用电量的城市尺度回标
    caveat: 天然气总量包含非供暖用途；供热统计边界可能与规划计算口径不同

  - source_id: S1_XJ_CLEAN_HEAT_CASES_2024
    scenario: scenario1_existing_network
    category: 工业余热与多能互补实测案例
    publisher: 新疆维吾尔自治区住房和城乡建设厅
    title: 新疆维吾尔自治区清洁能源供暖典型项目案例集
    url: https://zjt.xinjiang.gov.cn/xjzjt/c113210/202412/caeaca67293043bfb869118e2b0e7a97/files/%E8%87%AA%E6%B2%BB%E5%8C%BA%E6%B8%85%E6%B4%81%E8%83%BD%E6%BA%90%E4%BE%9B%E6%9A%96%E5%85%B8%E5%9E%8B%E9%A1%B9%E7%9B%AE%E6%A1%88%E4%BE%8B%E9%9B%86.pdf
    data_year: 2022-2024运行数据
    authority: 自治区住建主管部门典型案例
    use_in_model: 甘泉堡吸收式热泵容量、供热温度、投资、实际余热占比与工业停产备用逻辑
    caveat: 甘泉堡当前服务面积与标称能力口径不同；单个供暖季不能代表全寿命运行

  - source_id: S1_URUMQI_AIR_ALERT_EIA_2024
    scenario: scenario1_existing_network
    category: 工业共同原因限产
    publisher: 乌鲁木齐市生态环境局公开平台
    title: 乌鲁木齐华宇盛荣节能玻璃项目环境影响报告表（重污染天气响应条款）
    url: https://www.urumqi.gov.cn/wlmqs/c119218/202404/853a2ff138c145e99fc347e84c230d66/files/%E4%B9%8C%E9%B2%81%E6%9C%A8%E9%BD%90%E5%8D%8E%E5%AE%87%E7%9B%9B%E8%8D%A3%E8%8A%82%E8%83%BD%E7%8E%BB%E7%92%83%E6%9C%89%E9%99%90%E5%85%AC%E5%8F%B8%E5%B9%B4%E4%BA%A720%E4%B8%87%E5%B9%B3%E6%96%B9%E7%B1%B3%E7%8E%BB%E7%92%83%E5%88%B6%E5%93%81%E9%A1%B9%E7%9B%AE.pdf
    data_year: 2024
    authority: 地方生态环境主管部门公开环评
    use_in_model: 多家工业余热源同时降负荷的共同原因压力场景
    caveat: 生产负荷控制比例不等于余热按同一比例线性下降；民生保供时可能有差异化执行

  - source_id: S1_URUMQI_HEAT_ORDINANCE
    scenario: scenario1_existing_network
    category: 供热服务与事故约束
    publisher: 乌鲁木齐市人民代表大会常务委员会、甘泉堡经开区政府公开平台
    title: 乌鲁木齐市城市热力管理条例
    url: https://www.gqp.gov.cn/gqbkfq/c120325/202309/0aeef70776d84591aa972294391b1d32.shtml
    data_year: 2013施行（2023年官方公开）
    authority: 地方性法规
    use_in_model: 法定供热日历、最低室温、事故时长和退费可靠性约束
    caveat: 法定服务阈值不是热源设备设计参数；异常低温时供热期可调整

  - source_id: S1_NEA_SOLAR_CASES_2024
    scenario: scenario1_existing_network
    category: 跨季节水储热与水源热泵工程
    publisher: 国家能源局、生态环境部、住房城乡建设部
    title: 全国可再生能源供暖（制冷）典型案例汇编（2024）太阳能篇
    url: https://www.nea.gov.cn/20250326/336b8c000bcc45879ed82d445b40f772/20250326336b8c000bcc45879ed82d445b40f772_3813d26b5ce3a84828bd876839dde44b27.pdf
    data_year: 2021-2024运行数据（2025年发布）
    authority: 国家部委联合发布典型案例
    use_in_model: 季节储热体积、能量密度、投资、热泵COP、辅助热源与实测能耗校准
    caveat: 西藏辐照、高海拔和建设条件与乌鲁木齐不同；项目投资含管网和建筑改造

  - source_id: S1_SOLAR_PTES_GEOMETRY_2024
    scenario: scenario1_existing_network
    category: 跨季节储热热经济原始研究
    publisher: 太阳能学报；中国科学院电工研究所等
    title: 太阳能跨季节储热水体几何形状对系统含税热价的敏感性研究
    url: https://www.tynxb.org.cn/CN/10.19912/j.0254-0096.tynxb.2023-0508
    data_year: 2024
    authority: 同行评议原始论文
    use_in_model: PTES几何形状、热损和含税热价的非线性敏感性
    caveat: TRNSYS模拟而非乌鲁木齐实测；热损周期口径需结合论文正文使用

  - source_id: S1_CHIFENG_BTES_2020
    scenario: scenario1_existing_network
    category: 工业余热跨季节地埋管储热实测
    publisher: Applied Energy；清华大学等
    title: Large-scale living laboratory of seasonal borehole thermal energy storage system for urban district heating
    url: https://doi.org/10.1016/j.apenergy.2020.114763
    data_year: 2020
    authority: 同行评议原始论文与现场监测
    use_in_model: BTES体积、首次注热、土温演化和热影响半径
    caveat: 只披露首个注热期，不能据此认定长期回收效率或经济性

  - source_id: S1_NEA_ELECTRODE_BOILER_2021
    scenario: scenario1_existing_network
    category: 电极锅炉与水蓄热工程实测
    publisher: 国家能源局
    title: 全国可再生能源供暖典型案例汇编
    url: https://www.nea.gov.cn/download/kzsnydxan2021.pdf
    data_year: 2019-2021运行数据
    authority: 国家能源主管部门典型案例
    use_in_model: 电锅炉功率、调节范围、转换效率、水罐容量和系统综合效率
    caveat: 小型公共建筑项目，辅机损耗与规模效应不可直接外推到城市级

  - source_id: S1_NDRC_COAL_UPGRADE_2025
    scenario: scenario1_existing_network
    category: CHP灵活性与可靠性国家技术指标
    publisher: 国家发展改革委、国家能源局
    title: 新一代煤电升级专项行动实施方案（2025—2027年）
    url: https://www.ndrc.gov.cn/xwdt/tzgg/202504/P020250414409116337687.pdf
    data_year: 2025-2027
    authority: 国家部委正式政策技术指标
    use_in_model: CHP最小技术出力、低负荷持续时间、爬坡、煤耗惩罚与非计划停运
    caveat: 国家目标不等于乌鲁木齐具体机组验收曲线；分钟爬坡需更细时间尺度回放

  - source_id: S1_CHNENERGY_MOLTEN_SALT_2025
    scenario: scenario1_existing_network
    category: 火电热电解耦示范工程
    publisher: 国家能源投资集团有限责任公司
    title: 全国最大“火电+熔盐”储能项目主体完工
    url: https://www.chnenergy.com.cn/gjnyjtww/chnjtyw/202503/e9a2bf48931d42339a89e7fc9097a65b.shtml
    data_year: 2025
    authority: 中央能源企业项目公告
    use_in_model: 熔盐储热容量、温区、4至5小时解耦能力和新能源消纳效益
    caveat: 项目服务工业蒸汽而非乌鲁木齐热水网，且未公开完整总投资

  - source_id: S1_XINJIANG_RENEWABLE_2025
    scenario: scenario1_existing_network
    category: 新疆绿电可用背景
    publisher: 国家能源局新疆监管办公室
    title: 新疆能源监管办组织开展新能源消纳数据监测统计情况监管工作
    url: https://xjb.nea.gov.cn/dtyw/jgdt/202602/t20260210_295722.html
    data_year: 2025
    authority: 国家能源局派出监管机构
    use_in_model: 大规模绿电供热资源上限背景与消纳数据审计要求
    caveat: 全疆装机不等于乌鲁木齐逐时可获得绿电；仍需节点和输电约束

  - source_id: S1_XINJIANG_STORAGE_2024
    scenario: scenario1_existing_network
    category: 新疆电力储能与保供实绩
    publisher: 新疆维吾尔自治区发展和改革委员会
    title: 新型储能为电力保供添“底气”
    url: https://xjdrc.xinjiang.gov.cn/xjfgw/c108386/202507/3e24dc9a03ad41e1a68ff43de2a5383a.shtml
    data_year: 2024-2025
    authority: 自治区能源主管部门
    use_in_model: 电热耦合时电网侧储能时长、顶峰贡献和新能源消纳敏感性
    caveat: 属电化学等电力储能而非供热储热；全疆结果不可直接作为乌鲁木齐节点能力

