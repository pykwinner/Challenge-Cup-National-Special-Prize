<script type="text/javascript">
/**
 * 日期改变，重新请求数据
 */
function changeReportYear(){
	var reportYear = $("#reportYear").val();
	var dataid = $("#dataid").val();
	$.ajax({
	   type: "POST",
	   url: "/perxxgkinfo/syssb/wysb/hpsp/hpsp-company-sewage!getZxbgByYear.action",
	   data: {"reportYear":reportYear,"dataid":dataid},
	   dataType:"json",
	   success: function(msg){
  			// 重新赋值 
  			$("#zxbgTableBody").empty();
  			if(msg && msg.length > 0){
  				$.each(msg, function(index, item){
  					var tr = "<tr align='center'><td>"+item.type+"</td><td>"+item.reportTime+"</td><td><a style='text-decoration: underline;' target='_blank' href='"+item.docUrl+"'>执行报告文档</a></td></tr>";
  					$("#zxbgTableBody").append(tr);
  				});
  			} 
  			// 重新设置高度
  			resetHeight();
		}
	});
}

function resetHeight(){
	var height = $(document).height();
	if(parent && parent.setChildFrameHeight){
		parent.setChildFrameHeight(height + 50);
	} else if(parent && parent.$ && parent.$.fn.dialog){
		parent.$("iframe").each(function(){
			try{
				var h = $(this).contents().find("body").height();
				$(this).height(h + 50);
			}catch(e){}
		});
	}
}
</script>
