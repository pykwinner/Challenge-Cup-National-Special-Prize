<link href="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="https://rs2.huanqiucdn.cn/huanqiu/image/www/common/200.jpg" style="display:none;"><div id="config_page" style="display:none;">/csr-component/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="visibility:hidden;height:0; overflow:hidden;"><div id="csr_topheader_ad">7003383</div><div id="csr_bottomheaderl_ad">7005136</div><div id="csr_bottomheaderr_ad">7005137</div><!--<cs-control data-src="controls/csr_article_ad/csr_article_ad"></cs-control>--><article><textarea class="article-aid">9CaKrnJywem</textarea><textarea class="article-author">作者：严运涛 胡弦</textarea><textarea class="article-host">china.huanqiu.com</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">武汉寒冬供暖话题再引热议 3年后可享集中供暖</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-catnode">/e3pmh1nnq/e3pn60p0i</textarea><textarea class="article-content"><article><section data-type="rtext"><p><em data-scene="strong">寒风“吹热”集中供暖话题</em></p><p>今日，武汉进入一年中最寒冷的“三九”，“两会”上，集中供暖成为代表委员们热议话题：建设“幸福武汉”，为何不能实施集中供暖？</p><p>该市政协委员许以洪在提案中表示，武汉市民主要通过小锅炉供暖、电暖设备、燃气壁挂炉等方式取暖，但费用高、不安全，且加剧电、天然气等使用量，造成企业停气限产、居民限气采暖和拉闸限电等问题。</p><p>1月5日，武汉最低气温-7.2℃，创下新世纪以来第2冷。根据监测数据，气象专家认为，武汉今年冬天的气温较往年同期偏低。</p>
              <adv-loader __attr__inner="7004636" __attr__style="width: auto;position: relative;float: left;border: 1px solid #ebebeb; padding: 20px;overflow: hidden;margin: 10px 30px 40px 0;"></adv-loader>
            <p>寒风凛冽中，各种关于武汉寒冬的段子和图片蹿红。一些网友说：北方的冷是皮冷，进了房间就暖和；武汉冬天又湿又冷，冷得冻骨。如果能解决市民家庭集中供暖问题，将是重要的惠民举措。</p><p><em data-scene="strong">“南北供暖线”并非江城供暖禁令</em></p><p>“两会”代表和网友的抱怨与热议，引发武汉市政府的关注。昨日，该市发改委主任吴清专门约见记者积极回应。</p><p>上世纪50年代，中国以秦岭-淮河“南北供暖线”，划定北方集中供暖区。武汉划在不集中供暖的南方。</p><p>“但南方也要区别看待，武汉与海南比冷多了。”吴清说，这些年寒冷天气越来越多，市民对供暖的要求也越来越高，靠近传统南北供暖线，武汉市民要求供暖合情合理。</p><p><em data-scene="strong">缺钱缺能源，暂无力全城集中供暖</em></p><p>“但武汉实施集中供暖不能‘一刀切’。”吴清坦陈，与北方城市比，武汉的气温、享受的国家政策、企业供暖的风险、能源结构等差异性大，暂无力全城集中供暖。</p><p>武汉完全需要从外地调运能源，电、煤炭、天然气都要外采，一旦天然气等能源闹“饥荒”，居民、企事业都会“断粮”。</p><p>武汉冬天气温波动大，气温不如北方易把握，难以实施稳定、有计划的供暖。吴清说，武汉的冬天往往是冷几天后不冷，然后又冷。天冷大家都开暖气，不冷了又都关掉。这让供气方很难掌控供应量。按“照付不议”的原则，中石油、中石化上游给气即使用不完，武汉也得付钱。让武汉颇为纠结的是，若居民隔几天开关暖气，好不容易争取到的天然气指标，到底“要还是不要”？</p><p>此外，北方供暖基础设施建设、运转都有特殊政策，国家、省市均补贴，北京等市每年仅暖气运营的补贴就达数十亿元，但南方城市没有。吴清说，“如此巨额的投入，仅靠武汉地方财政扛不住，仅靠企业也受不了。种种因素决定，当前武汉供暖只能采取多元化——集中供暖与分散供暖并存。”</p><p><em data-scene="strong">鼓励多渠道发展供暖</em></p><p>武汉目前有部分集中供暖，主要采取“政府引导、企业主导、企业运作”模式。吴清表示，在部分居民需求强烈且具有相应经济实力的小区，如果有企业愿意集中供暖，则政府可以引导，但必须市场化。</p><p>“集中供暖政府不能给补贴。”吴清强调，武汉能享受集中供暖的毕竟是少数人，政府补贴会引发新的不公平。“政府有限的财力还是应该投向弱势群体。”</p><p><em data-scene="strong">3年后，百万人可享集中供暖</em></p><p>本报讯(记者严运涛、胡弦)3年之后，一成武汉人可享集中供暖。昨日，该市发改委主任吴清介绍，至“十二五”末集中供暖覆盖面积将达 3500万至4000万平方米，服务人口超百万。</p><p>目前，武汉部分区域已实行集中供暖，主要集中在江南。武昌地区利用青山热电厂和武昌热电厂的热电联供余热供暖；关山地区由湖北能源集团供暖，共5万户家庭、15万人受益。去年12月，神华集团与东西湖区签约，将投资55亿元建热电联供项目，建成后将成武汉最大的集中供暖项目，惠及约30万人。</p><p>此外，还有9万户居民采用地源热泵或天然气壁挂炉方式自行取暖。</p><p>吴清介绍，武汉正在加快推进“冬暖夏凉”工程，力争到“十二五”末，集中供热供冷服务人口超过百万，形成“多元化、多结构、多方式”的供暖格局。(记者严运涛 胡弦）</p></section></article></textarea><textarea class="article-time">1357615180000</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：haina</textarea><textarea class="article-source-name">湖北日报</textarea><textarea class="article-ext-xtime">1357615180000</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover"></textarea><textarea class="a
